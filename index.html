<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MFC-Kucha Arcade</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
  html,body{margin:0;width:100%;height:100%;height:100dvh;background:#05010f;color:#fff;font-family:"Courier New",monospace;overflow:hidden;position:fixed;inset:0}
  #wrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:560px;margin:0 auto}
  #stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
  canvas{display:block;background:#000}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="c" width="160" height="240"></canvas></div>
</div>
<script>
(()=>{
const W=160,VER='v1.5';let H=240;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
const cv=document.getElementById('c'),g=cv.getContext('2d');
g.imageSmoothingEnabled=true;

// ---------- Schrift & Zeichenhelfer (hochauflösend) ----------
const FONT='"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif';
function setFont(sc,align){
  g.font='bold '+(6.6*sc)+'px '+FONT;g.textBaseline='top';
  g.textAlign=align==='c'?'center':align==='r'?'right':'left';
}
function txt(s,x,y,col,sc=1,align='l'){
  setFont(sc,align);g.fillStyle=col;g.fillText(String(s).toUpperCase(),x,y-.8*sc);
}
function outl(s,x,y,col,sc=1,al='l'){
  g.save();setFont(sc,al);g.lineJoin='round';g.lineWidth=1.7*sc;g.strokeStyle='rgba(8,18,38,.85)';
  s=String(s).toUpperCase();g.strokeText(s,x,y-.8*sc);g.fillStyle=col;g.fillText(s,x,y-.8*sc);g.restore();
}
function rr(x,y,w,h,r){
  g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2),p=cv.parentElement;
  const pw=Math.max(160,p.clientWidth||Math.min(window.innerWidth||360,560));
  const ph=Math.max(240,p.clientHeight||window.innerHeight||640);
  let cw=pw,ch=ph;
  if(ch/cw<1.4)cw=Math.round(ch/1.5);
  else if(ch/cw>2.4)ch=Math.round(cw*2.4);
  if(cw>pw){cw=pw;ch=Math.min(ph,Math.round(cw*2.4));}
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  H=Math.round(W*ch/cw)||240;
  if(plane&&state!=='fall')plane.y=H*0.76;
  const w=Math.max(160,Math.round(cw*dpr)),h=Math.max(240,Math.round(ch*dpr));
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
}
addEventListener('resize',resize);

// ---------- Audio ----------
let AC=null,master=null,engOsc=null,engGain=null;
let muted=lsGet('mfcKuchaMute')==='1';
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}}
  if(!master){master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);}
  if(AC.state==='suspended')AC.resume();
}
function beep(f1,f2,dur,type='square',vol=.15,delay=0){
  if(!AC)return;const t=AC.currentTime+delay;
  const o=AC.createOscillator(),v=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+dur);
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(v).connect(master);o.start(t);o.stop(t+dur);
}
function startEngine(){
  if(!AC||engOsc)return;
  engOsc=AC.createOscillator();engGain=AC.createGain();
  const lfo=AC.createOscillator(),lg=AC.createGain();
  engOsc.type='sawtooth';engOsc.frequency.value=70;
  lfo.type='square';lfo.frequency.value=28;lg.gain.value=.03;
  engGain.gain.value=.04;
  lfo.connect(lg).connect(engGain.gain);
  engOsc.connect(engGain).connect(master);
  engOsc.start();lfo.start();engOsc._lfo=lfo;
}
function stopEngine(){
  if(!engOsc)return;
  try{engOsc.stop();engOsc._lfo.stop();}catch(e){}
  engOsc=null;engGain=null;
}
function sfxPickup(){beep(880,880,.07,'square',.15);beep(1320,1320,.12,'square',.15,.07);}
function sfxWarn(){beep(200,200,.08,'square',.1);}
function sfxCrash(){
  if(!AC)return;
  const n=AC.sampleRate*1.2,buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  let last=0;for(let i=0;i<n;i++){ if(i%40===0)last=Math.random()*2-1; d[i]=last*(1-i/n);}
  const s=AC.createBufferSource(),v=AC.createGain();s.buffer=buf;v.gain.value=.5;
  s.connect(v).connect(master);s.start();
  beep(300,30,.9,'sawtooth',.25);
}
function sfxStart(){[440,550,660,880].forEach((f,i)=>beep(f,f,.1,'square',.12,i*.09));}

// ---------- State ----------
let state='menu',score=0,hi=+(lsGet('mfcKuchaHi')||0),battery=100,t=0,speed=1,dist=0;
let bullets=[],lastShot=0,armorSeen=false,armorMsg=0;
let plane,heli=[],cells=[],parts=[],nextHeli=0,nextCell=0,shake=0,crashT=0,newHi=false;
const keys={L:false,R:false};

// ---------- Hintergrund (Draufsicht Modellflugplatz) ----------
const TILE=16;let scrollY=0;
const rows={};
function rnd(a,b){return a+Math.random()*(b-a);}
function hash(n){let x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x);}
function rowInfo(i){
  if(rows[i])return rows[i];
  const r={trees:[]};
  r.hangar=(((i%37)+37)%37===5)?(hash(i)<.5?'L':'R'):null;
  for(let k=0;k<2;k++){
    const h=hash(i*7+k*13);
    if(h<.5){
      const left=k===0;
      const x=left?Math.floor(hash(i*3+k)*3)*16+4:W-4-Math.floor(hash(i*5+k)*3)*16-8;
      r.trees.push({x:x,s:hash(i*11+k)});
    }
  }
  r.cross=(((i%25)+25)%25===0);
  r.logo=(!r.hangar&&!r.cross&&((i%23)+23)%23===11)?(hash(i*2)<.5?'L':'R'):null;
  rows[i]=r;
  if(Object.keys(rows).length>200){for(const key in rows)if(+key<i-30)delete rows[key];}
  return r;
}
function drawBG(){
  const base=Math.floor(scrollY/TILE),off=scrollY-base*TILE;
  const x0=W/2-22,rw=44;
  const list=[];
  // Pass 1: Boden
  for(let j=-1;j<=H/TILE+1;j++){
    const wr=base-j,y=j*TILE+off,r=rowInfo(wr);
    g.fillStyle=(wr&1)?'#3d8c37':'#459a3e';g.fillRect(0,y,W,TILE+.7);
    // Grastextur
    for(let n=0;n<9;n++){
      const hx=hash(wr*13+n)*W,hy=y+hash(wr*17+n*3)*TILE;
      if(hx>x0-3&&hx<x0+rw+3)continue;
      g.fillStyle=n&1?'rgba(0,0,0,.09)':'rgba(255,255,255,.06)';g.fillRect(hx,hy,1.3,1.3);
    }
    if(r.cross){
      const gr=g.createLinearGradient(0,y+4,0,y+12);gr.addColorStop(0,'#a58c5a');gr.addColorStop(.5,'#c2aa76');gr.addColorStop(1,'#a58c5a');
      g.fillStyle=gr;g.fillRect(0,y+4,x0,8);g.fillRect(x0+rw,y+4,W-x0-rw,8);
    }
    // Landebahn
    g.fillStyle='#8a8b7e';g.fillRect(x0-1.6,y,rw+3.2,TILE+.7);
    g.fillStyle='#4d5057';g.fillRect(x0,y,rw,TILE+.7);
    for(let n=0;n<5;n++){g.fillStyle=n&1?'rgba(0,0,0,.12)':'rgba(255,255,255,.05)';g.fillRect(x0+hash(wr*5+n)*rw,y+hash(wr*9+n)*TILE,2.2,1);}
    g.fillStyle='rgba(255,255,255,.75)';g.fillRect(x0+2.2,y,.8,TILE+.7);g.fillRect(x0+rw-3,y,.8,TILE+.7);
    if(wr%2===0){g.fillStyle='#f3f3ee';g.fillRect(W/2-.7,y+3,1.4,9);}
    if(((wr%25)+25)%25===12){g.fillStyle='rgba(255,255,255,.85)';for(let n=0;n<6;n++)g.fillRect(x0+5+n*6.2,y+2,3.2,12);}
    list.push({y,r,wr});
  }
  // Pass 2: Objekte
  if(logoGrass)for(const o of list){
    if(!o.r.logo)continue;
    const lw=50,lh=lw*logoGrass.height/logoGrass.width,cx=o.r.logo==='L'?29:131;
    g.save();g.globalAlpha=.72;g.drawImage(logoGrass,cx-lw/2,o.y+8-lh/2,lw,lh);g.restore();
  }
  for(const o of list){
    const y=o.y,r=o.r;
    if(r.hangar){
      const hx=r.hangar==='L'?6:W-6-34;
      g.fillStyle='rgba(0,0,0,.28)';g.fillRect(hx+4,y+2,34,26);
      const gr=g.createLinearGradient(hx,0,hx+34,0);gr.addColorStop(0,'#aab0ba');gr.addColorStop(.5,'#d3d8df');gr.addColorStop(1,'#9aa1ac');
      g.fillStyle=gr;g.fillRect(hx,y-2,34,26);
      g.fillStyle='rgba(0,0,0,.18)';for(let n=1;n<8;n++)g.fillRect(hx+n*4.2,y-2,.7,26);
      g.fillStyle='#d9531e';g.fillRect(hx,y-2,34,2.5);
      g.fillStyle='#6b717b';g.fillRect(hx,y+21,34,1.5);
      continue;
    }
    if(r.logo||rowInfo(o.wr-1).logo||rowInfo(o.wr+1).logo)continue;
    for(const tr of r.trees){
      if(tr.x>W/2-26&&tr.x<W/2+22)continue;
      const cx=tr.x+7,cy=y+8,rad=6+tr.s*3;
      g.fillStyle='rgba(0,0,0,.26)';g.beginPath();g.ellipse(cx+4,cy+5,rad,rad*.85,0,0,6.283);g.fill();
      for(let n=0;n<3;n++){
        const ox=(n-1)*rad*.45,oy=(n===1?-.35:.25)*rad,rr2=rad*(n===1?.85:.7);
        const gr=g.createRadialGradient(cx+ox-rr2*.3,cy+oy-rr2*.35,rr2*.1,cx+ox,cy+oy,rr2);
        gr.addColorStop(0,'#5fc156');gr.addColorStop(.6,'#2f8a34');gr.addColorStop(1,'#1c5c27');
        g.fillStyle=gr;g.beginPath();g.arc(cx+ox,cy+oy,rr2,0,6.283);g.fill();
      }
    }
  }
  // Wolkenschatten
  for(let k=0;k<3;k++){
    const cx=((k*83+t*4)%(W+100))-50,cy=((scrollY*1.4+k*97)%(H+140))-70,rx=34+k*9,ry=20+k*5;
    g.save();g.translate(cx,cy);g.scale(1,ry/rx);
    const gr=g.createRadialGradient(0,0,0,0,0,rx);gr.addColorStop(0,'rgba(0,20,0,.16)');gr.addColorStop(1,'rgba(0,20,0,0)');
    g.fillStyle=gr;g.beginPath();g.arc(0,0,rx,0,6.283);g.fill();g.restore();
  }
}

// ---------- Objekte ----------
function drawPlane(x,y,vx){
  const fp=(state==='fall'||(state==='dead'&&die.reason==='akku'))?Math.min(1,state==='dead'?1:crashT/1.35):0;
  const sc=1-fp*.58,sh=(1-fp)*1.05;
  const b=Math.max(-.3,Math.min(.3,(vx||0)*.0016))+fp*fp*1.5*(plane&&plane.fdir||1)+Math.sin(fp*14)*fp*.2;
  g.save();g.translate(x,y);
  // Schatten (rückt beim Sturzflug ans Flugzeug heran)
  g.save();g.translate(7*sh,10*sh);g.rotate(b);g.scale(sc,sc);g.globalAlpha=.22+fp*.22;g.fillStyle='#000';
  g.beginPath();g.ellipse(0,0,2.6,12,0,0,6.283);g.fill();
  g.beginPath();g.moveTo(-13,-3);g.lineTo(13,-3);g.lineTo(11,4);g.lineTo(-11,4);g.closePath();g.fill();
  g.beginPath();g.moveTo(-6,8);g.lineTo(6,8);g.lineTo(5,12);g.lineTo(-5,12);g.closePath();g.fill();
  g.restore();
  g.rotate(b);g.scale(sc,sc);
  // Höhenleitwerk
  let gr=g.createLinearGradient(0,8,0,12);gr.addColorStop(0,'#e8402f');gr.addColorStop(1,'#a8180f');
  g.fillStyle=gr;g.beginPath();g.moveTo(-6.5,9);g.lineTo(6.5,9);g.lineTo(5.2,12.5);g.lineTo(-5.2,12.5);g.closePath();g.fill();
  // Tragflächen
  gr=g.createLinearGradient(0,-4,0,5);gr.addColorStop(0,'#ff5a45');gr.addColorStop(1,'#b81c14');
  g.fillStyle=gr;g.beginPath();
  g.moveTo(-1,-4);g.lineTo(-13,-3);g.quadraticCurveTo(-14.6,0,-13,3.6);g.lineTo(-1,5);g.lineTo(1,5);g.lineTo(13,3.6);g.quadraticCurveTo(14.6,0,13,-3);g.lineTo(1,-4);g.closePath();g.fill();
  g.fillStyle='rgba(255,255,255,.92)';g.fillRect(-12.6,-.5,25.2,1.5);
  g.fillStyle='#ffd21f';g.fillRect(-13.9,-2.6,2.1,5.6);g.fillRect(11.8,-2.6,2.1,5.6);
  // Rumpf
  gr=g.createLinearGradient(-3,0,3,0);gr.addColorStop(0,'#c9ced6');gr.addColorStop(.45,'#ffffff');gr.addColorStop(1,'#b4bac4');
  g.fillStyle=gr;g.beginPath();g.moveTo(0,-11);g.bezierCurveTo(3.3,-10,3.1,-4,2.5,0);g.lineTo(1.4,12.5);g.lineTo(-1.4,12.5);g.lineTo(-2.5,0);g.bezierCurveTo(-3.1,-4,-3.3,-10,0,-11);g.closePath();g.fill();
  g.fillStyle='#d8261a';g.beginPath();g.ellipse(0,-9.6,2.6,1.9,0,0,6.283);g.fill();
  // Kanzel
  gr=g.createLinearGradient(0,-7,0,-1);gr.addColorStop(0,'#bfe8ff');gr.addColorStop(1,'#2b7fc4');
  g.fillStyle=gr;g.beginPath();g.ellipse(0,-4,1.7,3.1,0,0,6.283);g.fill();
  g.fillStyle='rgba(255,255,255,.7)';g.fillRect(-.9,-6.2,.6,2.2);
  // Propeller (dreht im Flug, steht bei leerem Akku)
  if(!fp){g.fillStyle='rgba(235,235,235,.2)';g.beginPath();g.arc(0,-12,6.2,0,6.283);g.fill();}
  g.save();g.translate(0,-12);g.rotate(fp?.4+(1-fp)*2.5:t*45);g.strokeStyle='rgba(25,25,25,.85)';g.lineWidth=1.3;g.lineCap='round';
  g.beginPath();g.moveTo(-6,0);g.lineTo(6,0);g.stroke();g.restore();
  g.fillStyle='#333';g.beginPath();g.arc(0,-12,1,0,6.283);g.fill();
  g.restore();
}
function drawHeli(h){
  const x=h.x,y=h.y,armor=h.armor;
  const c1=armor?'#4a82ff':'#ffa233',c2=armor?'#2250c8':'#e8700f',c3=armor?'#142f80':'#a84a06';
  // Schatten
  g.save();g.translate(x+7,y+11);g.globalAlpha=.22;g.fillStyle='#000';
  g.beginPath();g.ellipse(0,0,19,17,0,0,6.283);g.fill();g.restore();
  g.save();g.translate(x,y);if(h.dir<0)g.scale(-1,1);
  // Kufen
  g.strokeStyle='#26282c';g.lineWidth=1.3;g.lineCap='round';
  g.beginPath();g.moveTo(-6,-7);g.lineTo(9,-7);g.moveTo(-6,7);g.lineTo(9,7);g.stroke();
  // Heckausleger
  g.fillStyle=c3;g.fillRect(-21,-1.2,16,2.4);
  g.fillStyle=c2;g.beginPath();g.moveTo(-22,-1.2);g.lineTo(-19,-4.5);g.lineTo(-17,-4.5);g.lineTo(-17,-1.2);g.closePath();g.fill();
  // Heckrotor
  g.save();g.translate(-21,0);g.fillStyle='rgba(235,235,235,.25)';g.beginPath();g.arc(0,0,4.2,0,6.283);g.fill();
  g.rotate(h.a*1.3);g.strokeStyle='rgba(30,30,30,.8)';g.lineWidth=1;g.beginPath();g.moveTo(-4,0);g.lineTo(4,0);g.stroke();g.restore();
  // Rumpf
  const gr=g.createLinearGradient(0,-7,0,7);gr.addColorStop(0,c1);gr.addColorStop(.55,c2);gr.addColorStop(1,c3);
  g.fillStyle=gr;g.beginPath();g.moveTo(-8,-4);g.bezierCurveTo(-8,-8,6,-9,11,-3);g.bezierCurveTo(13,0,13,0,11,3);g.bezierCurveTo(6,9,-8,8,-8,4);g.closePath();g.fill();
  // Glaskanzel
  const gg=g.createLinearGradient(3,-5,10,4);gg.addColorStop(0,'#d8f3ff');gg.addColorStop(1,'#3a86c9');
  g.fillStyle=gg;g.beginPath();g.moveTo(3,-4);g.bezierCurveTo(7,-6.5,11,-3,11,0);g.bezierCurveTo(11,3,7,6.5,3,4);g.closePath();g.fill();
  g.fillStyle='rgba(255,255,255,.55)';g.fillRect(5,-4,3.5,1);
  if(armor){
    // Panzerplatten
    g.strokeStyle='#bcd2ff';g.lineWidth=.9;g.beginPath();g.moveTo(-8,-4);g.bezierCurveTo(-8,-8,6,-9,11,-3);g.stroke();
    g.fillStyle='#7f8ba8';g.fillRect(-7,-5,8,3.2);g.fillRect(-7,1.8,8,3.2);
    g.fillStyle='#e6ecff';for(let n=0;n<3;n++){g.fillRect(-6+n*3,-4.2,.9,.9);g.fillRect(-6+n*3,2.6,.9,.9);}
    g.strokeStyle='#142f80';g.lineWidth=.7;g.strokeRect(-7,-5,8,3.2);g.strokeRect(-7,1.8,8,3.2);
  }
  g.restore();
  // Hauptrotor (nicht gespiegelt)
  g.save();g.translate(x,y);
  g.fillStyle='rgba(235,240,245,.16)';g.beginPath();g.arc(0,0,18,0,6.283);g.fill();
  g.rotate(h.a);g.lineCap='round';
  g.strokeStyle='rgba(30,32,36,.35)';g.lineWidth=2.4;g.beginPath();g.moveTo(-18,0);g.lineTo(18,0);g.stroke();
  g.rotate(-.4);g.strokeStyle='rgba(30,32,36,.85)';g.lineWidth=1.5;g.beginPath();g.moveTo(-18,0);g.lineTo(18,0);g.stroke();
  g.rotate(Math.PI/2);g.strokeStyle='rgba(30,32,36,.5)';g.lineWidth=1.5;g.beginPath();g.moveTo(-18,0);g.lineTo(18,0);g.stroke();
  g.restore();
  g.fillStyle='#2a2d33';g.beginPath();g.arc(x,y,2.4,0,6.283);g.fill();
  g.fillStyle='#8a8f99';g.beginPath();g.arc(x-.5,y-.5,1,0,6.283);g.fill();
}
function drawCell(c){
  const x=c.x,y=c.y+Math.sin(t*5+c.p)*1.5;
  // Leuchten
  const gl=g.createRadialGradient(x,y,2,x,y,17);
  gl.addColorStop(0,'rgba(255,225,60,'+(.45+.2*Math.sin(t*8))+')');gl.addColorStop(1,'rgba(255,225,60,0)');
  g.fillStyle=gl;g.beginPath();g.arc(x,y,17,0,6.283);g.fill();
  // Schatten
  g.fillStyle='rgba(0,0,0,.25)';rr(x-8,y-3,18,10,2.5);g.fill();
  // Kabel
  g.lineCap='round';g.lineWidth=1.2;
  g.strokeStyle='#d62a2a';g.beginPath();g.moveTo(x+9,y-1.5);g.bezierCurveTo(x+13,y-5,x+15,y+1,x+18,y-2);g.stroke();
  g.strokeStyle='#18181a';g.beginPath();g.moveTo(x+9,y+1.5);g.bezierCurveTo(x+13,y+5,x+15,y+1,x+18,y+1);g.stroke();
  g.fillStyle='#ffd21f';rr(x+16.6,y-3.4,4,5.8,1);g.fill();
  // Akkupack
  const gr=g.createLinearGradient(0,y-5.5,0,y+5.5);gr.addColorStop(0,'#5d9bff');gr.addColorStop(.5,'#1f5fe0');gr.addColorStop(1,'#123c9c');
  g.fillStyle=gr;rr(x-10,y-5.5,20,11,2.5);g.fill();
  g.fillStyle='#ffd21f';rr(x-4.5,y-5.5,9,11,0);g.fill();
  g.fillStyle='#1a1a1e';g.fillRect(x-3.2,y-3,6.4,.9);g.fillRect(x-3.2,y-.4,6.4,.9);g.fillRect(x-3.2,y+2.2,4,.9);
  g.fillStyle='rgba(255,255,255,.35)';g.fillRect(x-9,y-4.7,4,1);
  g.strokeStyle='rgba(10,30,90,.8)';g.lineWidth=.7;rr(x-10,y-5.5,20,11,2.5);g.stroke();
}
function burst(x,y,n,cols,sp){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,v=rnd(.3,1)*sp;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.4,1),m:1,c:cols[Math.floor(Math.random()*cols.length)],s:Math.random()<.4?2:1});}
}

// ---------- HUD ----------
function drawHUD(){
  const gr=g.createLinearGradient(0,0,0,23);gr.addColorStop(0,'rgba(8,22,44,.92)');gr.addColorStop(1,'rgba(14,40,74,.78)');
  g.fillStyle=gr;g.fillRect(0,0,W,23);
  g.fillStyle='#ffb02e';g.fillRect(0,23,W,1);
  outl('MFC-KUCHA',5,3,'#ffd54a',1.9);
  txt('SCORE',5,14.5,'#8fd0ff',.85);txt(String(Math.floor(score)).padStart(5,'0'),30,14.5,'#fff',.95);
  txt('HI',W-62,14.5,'#8fd0ff',.85);txt(String(hi).padStart(5,'0'),W-52,14.5,'#fff',.95);
  // Akku-Anzeige (kompakt, Prozent exakt mittig)
  const bx=W-31,by=4.5,bw=25,bh=5.4;
  g.fillStyle='rgba(0,0,0,.55)';rr(bx-.9,by-.9,bw+1.8,bh+1.8,1.8);g.fill();
  g.strokeStyle='#e8eef5';g.lineWidth=.75;rr(bx-.9,by-.9,bw+1.8,bh+1.8,1.8);g.stroke();
  g.fillStyle='#e8eef5';rr(bx+bw+1,by+1.4,1.5,bh-2.8,.6);g.fill();
  const p=Math.max(0,battery)/100;
  let c1,c2;
  if(p>.5){c1='#7df06a';c2='#2aa63a';}else if(p>.25){c1='#ffe36a';c2='#e0a010';}
  else{const bl=Math.floor(t*6)%2;c1=bl?'#ff7a6a':'#a04040';c2=bl?'#d02020':'#601010';}
  if(p>0){
    const fg=g.createLinearGradient(0,by,0,by+bh);fg.addColorStop(0,c1);fg.addColorStop(1,c2);
    g.fillStyle=fg;rr(bx,by,Math.max(1.6,bw*p),bh,1.4);g.fill();
    g.fillStyle='rgba(255,255,255,.28)';g.fillRect(bx+.8,by+.6,Math.max(0,bw*p-1.6),1.2);
  }
  g.save();g.font='bold 3.6px '+FONT;g.textAlign='center';g.textBaseline='middle';
  g.lineWidth=.9;g.strokeStyle='rgba(0,0,0,.7)';
  const ps=Math.ceil(p*100)+'%';g.strokeText(ps,bx+bw/2,by+bh/2+.2);
  g.fillStyle='#fff';g.fillText(ps,bx+bw/2,by+bh/2+.2);g.restore();
}

// ---------- Spiel ----------
function reset(){
  plane={x:W/2,y:H*0.72,vx:0};heli=[];bullets=[];lastShot=-1;cells=[];parts=[];
  score=0;armorSeen=false;armorMsg=0;battery=100;t=0;speed=1;dist=0;nextHeli=1.2;nextCell=.8;shake=0;newHi=false;
}
function start(){
  initAudio();reset();state='play';sfxStart();startEngine();
}
function die(reason){
  if(state!=='play')return;
  die.reason=reason;stopEngine();crashT=0;
  if(Math.floor(score)>hi){hi=Math.floor(score);newHi=true;lsSet('mfcKuchaHi',hi);}
  if(reason==='akku'){
    state='fall';plane.fdir=plane.vx>=0?1:-1;
    beep(520,110,1.3,'triangle',.14);beep(240,55,1.3,'sawtooth',.08);
    return;
  }
  state='dead';shake=10;sfxCrash();
  burst(plane.x,plane.y,60,['#ff2a2a','#ff7a00','#ffe600','#fff','#555'],90);
}
function spawnHeli(){
  const armor=Math.random()<.5;
  if(armor&&!armorSeen){armorSeen=true;armorMsg=2.5;beep(300,300,.1,'square',.12);beep(220,220,.15,'square',.12,.12);}
  const dir=Math.random()<.5?1:-1;
  const y=-20;
  heli.push({x:dir>0?-25:W+25,y:y,dir:dir,vx:dir*rnd(35,55+speed*15),vy:rnd(10,30),a:0,armor:armor});
}
function spawnCell(){
  cells.push({x:rnd(30,W-30),y:-12,p:Math.random()*6});
}
function update(dt){
  t+=dt;
  if(state==='play'){
    speed=1+Math.min(2,dist/3000);
    const sc=60*speed;
    scrollY+=sc*dt;dist+=sc*dt;score+=dt*5*speed;
    battery-=dt*(3.2+speed*.8);
    // Steuerung
    const dirIn=(keys.R?1:0)-(keys.L?1:0);
    let target=dirIn*95;
    if(dirIn)plane.tx=null;
    if(!dirIn&&plane.tx!=null){
      const d=plane.tx-plane.x;
      target=Math.max(-220,Math.min(220,d*12));
    }
    plane.vx+=(target-plane.vx)*Math.min(1,dt*14);
    plane.x=Math.max(12,Math.min(W-12,plane.x+plane.vx*dt));
    if(engOsc)engOsc.frequency.value=70+speed*12+Math.abs(plane.vx)*.15;
    nextHeli-=dt;if(nextHeli<=0){spawnHeli();nextHeli=rnd(1.2,3.2)/Math.min(1.8,speed);}
    nextCell-=dt;if(nextCell<=0){spawnCell();nextCell=rnd(1.6,3.2);}
    for(const h of heli){
      h.x+=h.vx*dt;h.y+=(sc+h.vy)*dt;h.a+=dt*30;
    }
    heli=heli.filter(h=>h.y<H+30);
    for(const c of cells)c.y+=sc*dt;
    // Schüsse
    for(const b of bullets){
      b.y-=240*dt;
      for(const h of heli){
        if(!h.dead&&!b.dead&&Math.abs(h.x-b.x)<16&&Math.abs(h.y-8-b.y)<12){
          if(h.armor){b.dead=true;burst(b.x,b.y,6,['#fff','#9ab8ff','#ffe600'],40);beep(2200,1800,.04,'square',.08);continue;}
          h.dead=true;b.dead=true;score+=30;
          burst(h.x,h.y,30,['#ff7a00','#ffe600','#fff','#555'],70);
          parts.push({x:h.x,y:h.y-12,vx:0,vy:-18,l:.8,m:1,txt:'+30'});
          beep(500,40,.3,'sawtooth',.15);shake=3;
        }
      }
    }
    bullets=bullets.filter(b=>!b.dead&&b.y>-10);
    heli=heli.filter(h=>!h.dead);
    // Kollision Heli
    for(const h of heli){
      const dx=Math.abs(h.x-plane.x),dy=Math.abs((h.y-2)-plane.y);
      if(dx<15&&dy<9){die('heli');break;}
      if(Math.abs(h.y-8-plane.y)<4&&dx<20){die('heli');break;}
    }
    // Akkus
    for(const c of cells){
      if(Math.abs(c.x-plane.x)<16&&Math.abs(c.y-plane.y)<12){
        c.got=true;battery=Math.min(100,battery+25);score+=50;sfxPickup();
        burst(c.x,c.y,14,['#ffe600','#39c5ff','#fff'],50);
        parts.push({x:c.x,y:c.y-4,vx:0,vy:-18,l:.8,m:1,txt:'+50'});
      }
    }
    cells=cells.filter(c=>!c.got&&c.y<H+15);
    if(battery<=0){battery=0;die('akku');}
    else if(battery<25&&Math.floor(t*4)!==Math.floor((t-dt)*4)&&Math.floor(t*4)%2===0)sfxWarn();
    // Rauchspur
    if(Math.random()<.6)parts.push({x:plane.x+rnd(-1,1),y:plane.y+12,vx:0,vy:sc*.6,l:.35,m:.35,c:'#ddd',s:1,fade:1});
  }else if(state==='fall'){
    crashT+=dt;
    const k=Math.max(0,1-crashT/1.35),sc=60*speed*(.2+.8*k);
    scrollY+=sc*dt;
    plane.x=Math.max(14,Math.min(W-14,plane.x+(plane.vx*.25+plane.fdir*16*(1-k))*dt));
    plane.y-=14*k*dt;
    for(const h of heli){h.x+=h.vx*dt;h.y+=(sc+h.vy)*dt;h.a+=dt*30;}
    for(const c of cells)c.y+=sc*dt;
    if(crashT>=1.35){
      state='dead';crashT=0;shake=8;sfxCrash();
      burst(plane.x,plane.y,38,['#4a8c3f','#8a6f48','#d8261a','#fff','#555'],65);
      for(let i=0;i<14;i++)parts.push({x:plane.x+rnd(-5,5),y:plane.y+rnd(-5,5),vx:rnd(-22,22),vy:rnd(-22,22),l:rnd(.5,1),m:1,c:'#ccc',s:2,fade:1});
    }
  }else{
    scrollY+=(state==='menu'?30:0)*dt;
    if(state==='dead'){crashT+=dt;for(const h of heli)h.a+=dt*30;}
    if(state==='menu'){for(const h of heli){h.x+=h.vx*dt;h.a+=dt*30;}}
  }
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;}
  parts=parts.filter(p=>p.l>0);
  if(shake>0)shake=Math.max(0,shake-dt*20);
}
function draw(){
  resize();
  g.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  g.imageSmoothingEnabled=true;
  g.save();
  if(shake>0)g.translate(rnd(-shake,shake)*.4,rnd(-shake,shake)*.4);
  drawBG();
  for(const c of cells)drawCell(c);
  if(state!=='dead'||die.reason==='akku'||crashT<.05)drawPlane(plane?plane.x:W/2,plane?plane.y:H*.76,plane?plane.vx:0);
  for(const h of heli)drawHeli(h);
  for(const b of bullets){
    const gr=g.createLinearGradient(0,b.y,0,b.y+12);gr.addColorStop(0,'rgba(255,230,80,1)');gr.addColorStop(1,'rgba(255,160,0,0)');
    g.lineCap='round';g.strokeStyle=gr;g.lineWidth=2.6;g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x,b.y+10);g.stroke();
    g.strokeStyle='#fff';g.lineWidth=1;g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x,b.y+4);g.stroke();
  }
  for(const p of parts){
    if(p.txt){g.globalAlpha=Math.min(1,p.l/.4);outl(p.txt,p.x,p.y,'#ffe45a',1,'c');g.globalAlpha=1;continue;}
    if(p.fade){
      const k=Math.max(0,p.l/p.m);g.globalAlpha=k*.35;g.fillStyle='#f0f0f0';
      g.beginPath();g.arc(p.x,p.y,1+(1-k)*2.6,0,6.283);g.fill();g.globalAlpha=1;continue;
    }
    const k=Math.max(0,p.l);
    g.globalCompositeOperation='lighter';g.globalAlpha=Math.min(1,k*1.4);g.fillStyle=p.c;
    g.beginPath();g.arc(p.x,p.y,p.s*1.2*(.4+k*.9),0,6.283);g.fill();
    g.globalCompositeOperation='source-over';g.globalAlpha=1;
  }
  g.restore();
  // Vignette
  const vg=g.createRadialGradient(W/2,H/2,H*.32,W/2,H/2,H*.78);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.38)');
  g.fillStyle=vg;g.fillRect(0,0,W,H);
  if(state==='menu')drawMenu();
  else{drawHUD();if(state==='play'&&armorMsg>0){armorMsg-=1/60;if(Math.floor(t*6)%2===0)outl('GEPANZERT! NICHT ABSCHIESSBAR',W/2,29,'#8fb4ff',1,'c');}if(state==='dead')drawOver();}
  drawMute();
  txt('\u00A9 2026 CWS \u2022 MFC-KUCHA E.V.',4,H-6,'rgba(255,255,255,.45)',.62,'l');
  txt(VER,W-4,H-6,'rgba(255,255,255,.45)',.62,'r');
}
const muteRect={x:W-17,y:26,w:14,h:12};
function toggleMute(){
  muted=!muted;lsSet('mfcKuchaMute',muted?'1':'0');
  if(master)master.gain.value=muted?0:1;
}
function drawMute(){
  muteRect.y=state==='menu'?3:26;
  const m=muteRect;
  g.fillStyle='rgba(8,22,44,.8)';rr(m.x,m.y,m.w,m.h,3);g.fill();
  g.strokeStyle='#ffb02e';g.lineWidth=.8;rr(m.x,m.y,m.w,m.h,3);g.stroke();
  g.fillStyle='#fff';g.beginPath();
  g.moveTo(m.x+2.5,m.y+4.3);g.lineTo(m.x+4.8,m.y+4.3);g.lineTo(m.x+7,m.y+2.3);g.lineTo(m.x+7,m.y+9.7);g.lineTo(m.x+4.8,m.y+7.7);g.lineTo(m.x+2.5,m.y+7.7);g.closePath();g.fill();
  g.lineCap='round';
  if(muted){
    g.strokeStyle='#ff4a3a';g.lineWidth=1.2;g.beginPath();g.moveTo(m.x+8.5,m.y+4.2);g.lineTo(m.x+12,m.y+7.8);g.moveTo(m.x+12,m.y+4.2);g.lineTo(m.x+8.5,m.y+7.8);g.stroke();
  }else{
    g.strokeStyle='#ffd54a';g.lineWidth=1;g.beginPath();g.arc(m.x+7.4,m.y+6,2.6,-.9,.9);g.stroke();g.beginPath();g.arc(m.x+7.4,m.y+6,4.4,-.9,.9);g.stroke();
  }
}

function pill(x,y,w,h,pulse){
  const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'#ffcc4d');gr.addColorStop(1,'#e8760f');
  g.save();if(pulse){g.translate(x+w/2,y+h/2);g.scale(pulse,pulse);g.translate(-x-w/2,-y-h/2);}
  g.fillStyle='rgba(0,0,0,.35)';rr(x+1,y+2,w,h,h/2);g.fill();
  g.fillStyle=gr;rr(x,y,w,h,h/2);g.fill();
  g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=.8;rr(x,y,w,h,h/2);g.stroke();
  g.restore();
}

  const wob=Math.sin(t*2.2)*1.5;
  g.fillStyle='rgba(0,0,0,.4)';rr(13,34+wob,W-26,58,9);g.fill();
  const cg=g.createLinearGradient(0,30,0,88);cg.addColorStop(0,'#16406e');cg.addColorStop(1,'#0a2342');
  g.fillStyle=cg;rr(10,30+wob,W-20,58,9);g.fill();
  g.strokeStyle='#ffb02e';g.lineWidth=1.5;rr(10,30+wob,W-20,58,9);g.stroke();
  const tg=g.createLinearGradient(0,34,0,60);tg.addColorStop(0,'#fff3b0');tg.addColorStop(1,'#ffb02e');
  if(logoTint){const lw=124,lh=lw*logoTint.height/logoTint.width;g.save();g.shadowColor='rgba(0,0,0,.55)';g.shadowOffsetY=2;g.shadowBlur=5;g.drawImage(logoTint,W/2-lw/2,59-lh/2+wob,lw,lh);g.restore();}
  else{outl('MFC',W/2,33+wob,tg,4.4,'c');outl('KUCHA',W/2,62+wob,'#8fd8ff',3,'c');}

  txt('MFC-KUCHA',W/2,98,'#fff',1,'c');
  txt('FLUGSPIEL',W/2,108,'#ffb02e',1,'c');
  drawHeli({x:40,y:128,dir:1,a:t*30,armor:false});drawHeli({x:120,y:128,dir:1,a:t*30,armor:true});
  outl('ABSCHIESSEN',40,144,'#ffbe66',.95,'c');outl('AUSWEICHEN!',120,144,'#9ec0ff',.95,'c');
  drawPlane(W/2,170+Math.sin(t*2)*3,Math.sin(t*1.5)*60);
  pill(36,183,W-72,17,1+.03*Math.sin(t*5));
  outl('PRESS START',W/2,189.8,'#fff',1.2,'c');
  txt('WISCHEN LENKT - TIPPEN FEUERT',W/2,203,'#e8f2ff',.85,'c');
  txt('HIGHSCORE '+String(hi).padStart(5,'0'),W/2,214,'#8fd0ff',.9,'c');
  g.restore();
}
function drawOver(){
  const oy=Math.max(0,(H-240)*.45);
  btnRect.y=160+oy;
  g.fillStyle='rgba(30,4,4,'+Math.min(.6,crashT*.8)+')';g.fillRect(0,24,W,H-24);
  if(crashT<.6)return;
  g.save();g.translate(0,oy);
  g.fillStyle='rgba(0,0,0,.4)';rr(17,50,W-30,110,9);g.fill();
  g.fillStyle='rgba(10,24,46,.92)';rr(14,46,W-28,110,9);g.fill();
  g.strokeStyle='#ff5a45';g.lineWidth=1.3;rr(14,46,W-28,110,9);g.stroke();
  outl('CRASH!',W/2,54,'#ff5a45',3.4,'c');
  txt(die.reason==='akku'?'AKKU LEER!':'HELI-KOLLISION!',W/2,84,'#fff',1,'c');
  txt('SCORE '+String(Math.floor(score)).padStart(5,'0'),W/2,100,'#ffd54a',1.7,'c');
  txt('HIGHSCORE '+String(hi).padStart(5,'0'),W/2,124,'#8fd0ff',1,'c');
  if(newHi&&Math.floor(t*4)%2===0)txt('NEUER REKORD!',W/2,138,'#6df07a',1,'c');
  const b=btnRect;
  g.restore();
  pill(b.x,b.y,b.w,b.h,1+.02*Math.sin(t*5));
  outl('NOCHMAL SPIELEN',W/2,b.y+5.4,'#fff',1,'c');
}
const btnRect={x:20,y:160,w:W-40,h:20};

// ---------- Eingabe ----------
function setKey(code,v){
  if(code==='ArrowLeft'||code==='KeyA')keys.L=v;
  else if(code==='ArrowRight'||code==='KeyD')keys.R=v;
}
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','Space','Enter'].includes(e.code))e.preventDefault();
  setKey(e.code,true);
  if(e.code==='Space'&&state==='play'&&!e.repeat)fire();
  if(!e.repeat&&(e.code==='Space'||e.code==='Enter')&&(state==='menu'||(state==='dead'&&crashT>.8)))start();
});
addEventListener('keyup',e=>setKey(e.code,false));
addEventListener('blur',()=>{keys.L=keys.R=false;});

function bindBtn(id,k){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();e.stopPropagation();initAudio();keys[k]=true;el.classList.add('on');
    if(state==='menu'||(state==='dead'&&crashT>.8))start();};
  const off=e=>{e.preventDefault();keys[k]=false;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,off));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

// Wisch-Steuerung: Finger relativ ziehen, Flugzeug folgt
const swipe={id:null,sx:0,px:0};
function swipeEnd(e){
  if(e.pointerId===swipe.id){
    // kurzes Antippen ohne Wischen = Feuer
    if(e.type==='pointerup'&&state==='play'&&Math.abs(e.clientX-swipe.sx)<10&&performance.now()-swipe.t0<300)fire();
    swipe.id=null;plane&&(plane.tx=null);
  }
}
function fire(){
  if(state!=='play'||t-lastShot<.18)return;
  lastShot=t;bullets.push({x:plane.x,y:plane.y-14});
  beep(1400,300,.09,'square',.08);
}
// Maus (Desktop): Flugzeug folgt der Mausposition ohne Taste, Klick = Feuer
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'&&state==='play'){const r=cv.getBoundingClientRect();plane.tx=(e.clientX-r.left)/r.width*W;return;}
}); 
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==swipe.id||state!=='play')return;
  const r=cv.getBoundingClientRect();
  plane.tx=swipe.px+(e.clientX-swipe.sx)/r.width*W;
});
cv.addEventListener('pointerup',swipeEnd);
cv.addEventListener('pointercancel',swipeEnd);
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();
  {const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H,m=muteRect;if(x>=m.x-6&&x<=m.x+m.w+4&&y>=m.y-4&&y<=m.y+m.h+6){toggleMute();return;}}
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(state==='play'){if(e.pointerType==='mouse')fire();else{swipe.id=e.pointerId;swipe.sx=e.clientX;swipe.t0=performance.now();swipe.px=plane.x;plane.tx=plane.x;}}
  if(state==='menu')start();
  else if(state==='dead'&&crashT>.8){
    const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
    if(x>=btnRect.x&&x<=btnRect.x+btnRect.w&&y>=btnRect.y-6&&y<=btnRect.y+btnRect.h+6)start();
  }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopEngine();else if(state==='play')startEngine();});

// ---------- Loop ----------
reset();state='menu';
// Menü: ein paar Deko-Helis
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
